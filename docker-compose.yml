services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: virashops
      POSTGRES_PASSWORD: virashops
      POSTGRES_DB: virashops
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U virashops -d virashops']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    profiles: ['files', 'app']
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: virashops
      MINIO_ROOT_PASSWORD: virashopssecret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    profiles: ['files', 'app']
    depends_on:
      - minio
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - |
        for i in $$(seq 1 30); do
          mc alias set local http://minio:9000 virashops virashopssecret && break
          sleep 2
        done
        mc mb --ignore-existing local/virashops

  api:
    build: .
    profiles: ['app']
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_HOST: redis
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: virashops
      AWS_SECRET_ACCESS_KEY: virashopssecret
      AWS_S3_BUCKET: virashops
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
