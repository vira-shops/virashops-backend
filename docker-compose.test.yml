services:
  api:
    profiles: !reset []
    environment:
      OTP_DEV_CODE: '123456'
      OTP_RESEND_SECONDS: '1'
      ADMIN_PHONE: '09000000001'
      ADMIN_NAME: Api Check Admin
      AWS_S3_BUCKET: ''
      AWS_S3_ENDPOINT: ''
      PLATFORM_COMMISSION_PERCENT: '5'
      FREE_SHIPPING_THRESHOLD: '20000000'
      PAYMENT_STUB_REDIRECT_URL: 'https://pay.stub.local/redirect'
      CHEQUE_PAYEE_NAME: 'شرکت ویرا'
      CHEQUE_PAYEE_NATIONAL_ID: '1230123025'
      CHEQUE_MAILING_ADDRESS: 'استان یزد، شهر اردکان، خیابان شهید رجایی، کوچه ۴۷، پلاک ۳۳۱'
      CHEQUE_MAILING_POSTAL_CODE: '1234567891'

  auth-api-check:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    image: virashops-back:test
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      BASE_URL: http://api:3000
      OTP_DEV_CODE: '123456'
      ADMIN_PHONE: '09000000001'
      AUTH_API_CHECK_OUTPUT: /app/test-results/auth-api-check.json
    volumes:
      - .:/app
      - /app/node_modules
      - ./test-results:/app/test-results
    command: ['npm', 'run', 'auth-api-check']

